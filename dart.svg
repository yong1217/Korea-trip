<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 단독 다트: 과녁 없이 다트만 표시 -->
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#6f7783"/>
      <stop offset=".5" stop-color="#dfe4e9"/>
      <stop offset="1" stop-color="#737b87"/>
    </linearGradient>
  </defs>

  <!-- shaft -->
  <rect x="47" y="18" width="8" height="63" rx="4"
        transform="rotate(45 51 49)" fill="url(#metal)"/>

  <!-- point -->
  <path d="M83 86 L103 106 L78 92 Z"
        fill="#4e5661"/>

  <!-- barrel -->
  <path d="M54 59 L75 80 L69 86 L48 65 Z"
        fill="#313a47"/>
  <path d="M57 57 L77 77" stroke="#b9c1ca" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 62 L72 82" stroke="#737d89" stroke-width="2" stroke-linecap="round"/>

  <!-- flight -->
  <path d="M41 51 L17 27 L27 18 L51 42 Z"
        fill="#e45757"/>
  <path d="M35 48 L14 28 L20 20 L43 41 Z"
        fill="#f07a7a"/>

  <!-- flight divider -->
  <path d="M20 27 L39 45"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".85"/>

  <!-- rear cap -->
  <circle cx="20" cy="24" r="5" fill="#29313d"/>
</svg>
