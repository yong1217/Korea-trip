<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>TRAVEL DART</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --sub: #6d7585;
      --line: #dfe4ec;
      --primary: #263b70;
      --primary-light: #edf1ff;
      --accent: #e45757;
      --map: #eef2f7;
      --map-line: #9ba6b7;
      --map-selected: #ffcf5a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #ffffff 0%, #f5f7fb 48%, #edf1f6 100%);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 22px 16px 40px;
      position: relative;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: var(--primary);
    }

    .title {
      margin: 7px 0 3px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
    }

    /* ---------------- MAP ---------------- */

    .map-card {
      position: relative;
      width: 100%;
      aspect-ratio: 0.9 / 1;
      min-height: 510px;
      max-height: 720px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(210,217,228,0.9);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(27, 43, 75, 0.09);
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #map svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .province-path {
      fill: var(--map);
      stroke: var(--map-line);
      stroke-width: 0.75;
      vector-effect: non-scaling-stroke;
      transition:
        fill 0.25s ease,
        stroke 0.25s ease,
        filter 0.25s ease;
    }

    .province-path:hover {
      fill: #e4eaf3;
    }

    .province-path.selected {
      fill: var(--map-selected);
      stroke: #d39e1d;
      stroke-width: 2;
      filter: drop-shadow(0 4px 8px rgba(190, 137, 16, 0.25));
    }

    /* 지도 로딩 */

    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      color: var(--sub);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(4px);
      z-index: 20;
    }

    .loading-spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid #dce2eb;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------------- DART ---------------- */

    .dart {
      position: absolute;
      z-index: 30;
      width: 74px;
      height: 74px;
      pointer-events: none;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%) rotate(-35deg);
      opacity: 0;
      font-size: 54px;
      line-height: 1;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.22));
      transform-origin: 50% 50%;
    }

    .dart.fly {
      animation: dart-fly var(--flight-time, 1500ms) cubic-bezier(.18,.75,.24,1) forwards;
    }

    /*
      실제 이동은 JS에서 CSS 변수로
      시작점 → 포물선 → 도착점을 계산한다.
    */

    .dart-impact {
      position: absolute;
      z-index: 31;
      pointer-events: none;
      font-size: 38px;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
    }

    .dart-impact.show {
      animation: impact 520ms ease-out forwards;
    }

    @keyframes impact {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }

      35% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.65);
      }
    }

    /* ---------------- STATUS ---------------- */

    .status-area {
      position: absolute;
      z-index: 40;
      left: 20px;
      right: 20px;
      bottom: 22px;
      text-align: center;
      pointer-events: none;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(218,224,233,0.95);
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(30,40,60,0.08);
      font-size: 13px;
      color: var(--sub);
    }

    /* ---------------- RESULT ---------------- */

    .result-card {
      margin-top: 16px;
      padding: 22px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(30, 42, 65, 0.07);
      text-align: center;
      display: none;
    }

    .result-card.show {
      display: block;
      animation: result-in 0.5s ease-out;
    }

    @keyframes result-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 4px;
    }

    .result-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.05em;
      margin-bottom: 5px;
    }

    .result-description {
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* ---------------- BUTTONS ---------------- */

    .button-area {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .main-button {
      min-height: 58px;
      border-radius: 18px;
      background: var(--primary);
      color: white;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 9px 20px rgba(38,59,112,0.2);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .main-button:active {
      transform: scale(0.97);
    }

    .main-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .secondary-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary-button {
      min-height: 52px;
      border-radius: 16px;
      background: white;
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 750;
    }

    .secondary-button.confirm {
      background: #172033;
      color: white;
      border-color: #172033;
    }

    /* ---------------- SEARCH LINKS ---------------- */

    .travel-links {
      display: none;
      margin-top: 16px;
      padding: 20px;
      border-radius: 24px;
      background: white;
      border: 1px solid var(--line);
    }

    .travel-links.show {
      display: block;
      animation: result-in 0.45s ease-out;
    }

    .travel-links h2 {
      margin: 0 0 5px;
      font-size: 20px;
      letter-spacing: -0.04em;
    }

    .travel-links p {
      margin: 0 0 14px;
      color: var(--sub);
      font-size: 13px;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .travel-link {
      min-height: 72px;
      padding: 10px 6px;
      border-radius: 15px;
      background: #f6f8fb;
      color: var(--text);
      text-decoration: none;
      border: 1px solid #e5e9ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 750;
    }

    .travel-link span:first-child {
      font-size: 24px;
    }

    /* ---------------- FOOTER ---------------- */

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #9aa3b2;
      font-size: 10px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 12px 30px;
      }

      .title {
        font-size: 27px;
      }

      .map-card {
        min-height: 480px;
        border-radius: 24px;
      }

      .result-name {
        font-size: 29px;
      }

      .link-grid {
        grid-template-columns: 1fr;
      }

      .travel-link {
        flex-direction: row;
        justify-content: flex-start;
        padding-left: 18px;
        min-height: 56px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">TRAVEL DART</div>
    <h1 class="title">오늘은 어디로 떠날까요?</h1>
    <p class="subtitle">대한민국에 다트를 던져 여행지를 결정해보세요.</p>
  </header>

  <section class="map-card">

    <div id="map"></div>

    <div class="map-loading" id="mapLoading">
      <div class="loading-spinner"></div>
      <div>대한민국 지도를 불러오는 중...</div>
    </div>

    <div class="dart" id="dart">🎯</div>

    <div class="dart-impact" id="impact">💥</div>

    <div class="status-area">
      <div class="status" id="status">
        지도를 불러오는 중입니다.
      </div>
    </div>

  </section>

  <section class="result-card" id="resultCard">

    <div class="result-label">🎯 오늘의 여행지</div>

    <div class="result-name" id="resultName">
      -
    </div>

    <div class="result-description" id="resultDescription">
      -
    </div>

    <div class="secondary-buttons">

      <button
        class="secondary-button"
        id="againButton"
        disabled
      >
        🔄 다시 던지기
      </button>

      <button
        class="secondary-button confirm"
        id="confirmButton"
        disabled
      >
        ❤️ 여기로 결정
      </button>

    </div>

  </section>

  <section class="travel-links" id="travelLinks">

    <h2 id="travelTitle">📍 여행 준비하기</h2>

    <p>
      선택한 지역의 관광지·맛집·숙소를 검색해보세요.
    </p>

    <div class="link-grid">

      <a
        class="travel-link"
        id="tourismLink"
        target="_blank"
        rel="noopener"
      >
        <span>🏛️</span>
        <span>관광지 검색</span>
      </a>

      <a
        class="travel-link"
        id="foodLink"
        target="_blank"
        rel="noopener"
      >
        <span>🍴</span>
        <span>맛집 검색</span>
      </a>

      <a
        class="travel-link"
        id="hotelLink"
        target="_blank"
        rel="noopener"
      >
        <span>🏨</span>
        <span>숙소 검색</span>
      </a>

    </div>

  </section>

  <div class="button-area">

    <button
      class="main-button"
      id="dartButton"
      disabled
    >
      🎯 다트 던지기
    </button>

  </div>

  <footer class="footer">
    행정구역 경계 데이터: 통계청 SGIS 기반 statgarten/maps 활용
  </footer>

</div>


<script>

/* ============================================================
   TRAVEL DART
   1차 버전
   ============================================================ */


/* ------------------------------------------------------------
   1. 지도 데이터
   ------------------------------------------------------------ */

/*
  statgarten/maps에서 제공하는 시군구 GeoJSON.

  각 파일에는 해당 지역의 시군구 경계가 들어있다.
*/

const MAP_BASE =
  "https://raw.githubusercontent.com/statgarten/maps/main/json/";

const MAP_FILES = [

  "강원도_시군구_경계.json",
  "경기도_시군구_경계.json",
  "경상남도_시군구_경계.json",
  "경상북도_시군구_경계.json",

  "광주광역시_시군구_경계.json",
  "대구광역시_시군구_경계.json",
  "대전광역시_시군구_경계.json",
  "부산광역시_시군구_경계.json",

  "서울특별시_시군구_경계.json",
  "세종특별자치시_시군구_경계.json",
  "울산광역시_시군구_경계.json",
  "인천광역시_시군구_경계.json",

  "전라남도_시군구_경계.json",
  "전라북도_시군구_경계.json",

  "제주특별자치도_시군구_경계.json",

  "충청남도_시군구_경계.json",
  "충청북도_시군구_경계.json"

];


/* ------------------------------------------------------------
   2. 특별 여행지
   ------------------------------------------------------------ */

const SPECIAL_DESTINATIONS = [

  {
    id: "ulleungdo-dokdo",
    name: "울릉도·독도",
    description: "동해의 섬 여행"
  }

];


/* ------------------------------------------------------------
   3. DOM
   ------------------------------------------------------------ */

const mapContainer =
  document.getElementById("map");

const mapLoading =
  document.getElementById("mapLoading");

const status =
  document.getElementById("status");

const dart =
  document.getElementById("dart");

const impact =
  document.getElementById("impact");

const dartButton =
  document.getElementById("dartButton");

const resultCard =
  document.getElementById("resultCard");

const resultName =
  document.getElementById("resultName");

const resultDescription =
  document.getElementById("resultDescription");

const againButton =
  document.getElementById("againButton");

const confirmButton =
  document.getElementById("confirmButton");

const travelLinks =
  document.getElementById("travelLinks");

const travelTitle =
  document.getElementById("travelTitle");

const tourismLink =
  document.getElementById("tourismLink");

const foodLink =
  document.getElementById("foodLink");

const hotelLink =
  document.getElementById("hotelLink");


/* ------------------------------------------------------------
   4. 상태
   ------------------------------------------------------------ */

let mapSvg = null;
let projection = null;
let pathGenerator = null;

let allRegions = [];
let candidates = [];

let usedDestinations = new Set();

let currentDestination = null;

let isThrowing = false;


/* ------------------------------------------------------------
   5. 지도 로딩
   ------------------------------------------------------------ */

async function loadMaps() {

  try {

    status.textContent =
      "전국 행정구역 지도를 불러오는 중...";

    const results = await Promise.all(

      MAP_FILES.map(async file => {

        const url =
          MAP_BASE + encodeURIComponent(file);

        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            `${file} 불러오기 실패`
          );
        }

        return response.json();

      })

    );


    /*
      모든 지역 Feature 합치기
    */

    const features = [];

    results.forEach(data => {

      if (data.features) {
        features.push(...data.features);
      }

    });


    allRegions = features;


    createMap(features);

    createCandidates(features);


    mapLoading.style.display = "none";

    dartButton.disabled = false;

    status.textContent =
      `${candidates.length}개의 여행지를 준비했습니다.`;

  }

  catch(error) {

    console.error(error);

    mapLoading.innerHTML = `
      <div style="
        font-size:40px;
        margin-bottom:8px;
      ">⚠️</div>

      <div style="
        font-weight:700;
        color:#172033;
      ">
        지도를 불러오지 못했습니다.
      </div>

      <div style="
        font-size:12px;
        margin-top:5px;
      ">
        인터넷 연결을 확인한 후 새로고침해주세요.
      </div>
    `;

    status.textContent =
      "지도 로딩 실패";

  }

}


/* ------------------------------------------------------------
   6. 지도 생성
   ------------------------------------------------------------ */

function createMap(features) {

  mapContainer.innerHTML = "";

  const width =
    mapContainer.clientWidth;

  const height =
    mapContainer.clientHeight;


  mapSvg =
    d3.select(mapContainer)
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("preserveAspectRatio", "xMidYMid meet");


  /*
    대한민국 전체 경계를 기준으로 자동 투영
  */

  const collection = {
    type: "FeatureCollection",
    features
  };


  projection =
    d3.geoMercator()
      .fitSize(
        [width * 0.9, height * 0.88],
        collection
      );


  /*
    지도 위치를 살짝 중앙으로 이동
  */

  projection.translate([
    width * 0.5,
    height * 0.47
  ]);


  pathGenerator =
    d3.geoPath()
      .projection(projection);


  /*
    지역 그리기
  */

  mapSvg
    .append("g")
    .attr("class", "regions")
    .selectAll("path")
    .data(features)
    .enter()
    .append("path")
    .attr("class", "province-path")
    .attr("d", pathGenerator)
    .attr("data-region-index", (_, i) => i)
    .on("click", function(event, feature) {

      /*
        지도 클릭 자체는 현재 1차 버전에서는
        추첨 기능과 분리한다.
      */

      const name =
        getRegionName(feature);

      status.textContent =
        name
          ? `${name} 지역`
          : "대한민국 행정구역";

    });

}


/* ------------------------------------------------------------
   7. 지역 이름 추출
   ------------------------------------------------------------ */

function getRegionName(feature) {

  const p =
    feature.properties || {};


  /*
    데이터 버전에 따라 이름 필드가 다를 수 있으므로
    여러 후보를 확인한다.
  */

  return (
    p.name ||
    p.NAME ||
    p.adm_nm ||
    p.sgg_nm ||
    p.SGG_NM ||
    p.nm ||
    p.NM ||
    p.region ||
    null
  );

}


/* ------------------------------------------------------------
   8. 추첨 후보 만들기
   ------------------------------------------------------------ */

function createCandidates(features) {

  const mapCandidates = [];


  features.forEach((feature, index) => {

    const name =
      getRegionName(feature);

    if (!name) return;


    /*
      "구" 단위 제외.

      예:
      종로구
      강남구
      수영구
      등을 후보에서 제외한다.
    */

    if (name.endsWith("구")) {
      return;
    }


    /*
      시 또는 군만 후보.

      서울특별시
      부산광역시
      제주 시 등은
      이름에 "시"가 들어간다.

      세종특별자치시 역시 포함된다.
    */

    const isCity =
      name.endsWith("시");

    const isCounty =
      name.endsWith("군");


    if (!isCity && !isCounty) {
      return;
    }


    /*
      제주특별자치도 자체는 후보로 넣지 않고
      제주시는 별도 시로 처리한다.
    */

    mapCandidates.push({

      id: `region-${index}`,

      name,

      description:
        `${name} 여행`,

      type: "region",

      featureIndex: index

    });

  });


  /*
    이름 중복 제거
  */

  const unique =
    new Map();


  mapCandidates.forEach(item => {

    if (!unique.has(item.name)) {
      unique.set(item.name, item);
    }

  });


  candidates = [
    ...unique.values(),
    ...SPECIAL_DESTINATIONS
  ];


  /*
    여행지 개수 표시
  */

  console.log(
    "추첨 후보:",
    candidates
  );

}


/* ------------------------------------------------------------
   9. 랜덤 여행지
   ------------------------------------------------------------ */

function getRandomDestination() {

  const available =
    candidates.filter(
      item =>
        !usedDestinations.has(item.id)
    );


  /*
    모두 소진했다면 다시 시작
  */

  if (available.length === 0) {

    usedDestinations.clear();

    status.textContent =
      "모든 여행지를 한 번씩 뽑았습니다. 다시 처음부터 시작합니다.";

    return candidates[
      Math.floor(
        Math.random() * candidates.length
      )
    ];

  }


  return available[
    Math.floor(
      Math.random() * available.length
    )
  ];

}


/* ------------------------------------------------------------
   10. 다트 던지기
   ------------------------------------------------------------ */

dartButton.addEventListener(
  "click",
  throwDart
);


async function throwDart() {

  if (isThrowing) return;

  if (!mapSvg || !projection) return;


  isThrowing = true;

  dartButton.disabled = true;

  againButton.disabled = true;

  confirmButton.disabled = true;

  travelLinks.classList.remove("show");


  resultCard.classList.remove("show");


  /*
    랜덤 여행지 결정
  */

  const destination =
    getRandomDestination();


  currentDestination =
    destination;


  /*
    일단 이전 선택 강조 제거
  */

  mapSvg
    .selectAll(".province-path")
    .classed("selected", false);


  /*
    특별 후보인 울릉도·독도
    */

  let target;


  if (
    destination.type === "region"
  ) {

    const feature =
      allRegions[
        destination.featureIndex
      ];


    /*
      지역의 중심 좌표 계산
    */

    target =
      pathGenerator.centroid(feature);


  } else {

    /*
      울릉도·독도는 지도 우측/동쪽에
      별도 표시될 수 있도록 목표 좌표를 지정한다.

      대한민국 지도 projection의 좌표를 이용해
      대략적인 동해 위치에 배치한다.
    */

    const geoPoint = [
      130.8,
      37.5
    ];

    target =
      projection(geoPoint);

  }


  /*
    화면 범위를 벗어나지 않도록 보정
  */

  target[0] =
    Math.max(
      30,
      Math.min(
        mapContainer.clientWidth - 30,
        target[0]
      )
    );

  target[1] =
    Math.max(
      30,
      Math.min(
        mapContainer.clientHeight - 80,
        target[1]
      )
    );


  status.textContent =
    "🎯 다트가 날아갑니다...";


  /*
    애니메이션 시작점

    중앙 하단
  */

  const start = {

    x:
      mapContainer.clientWidth / 2,

    y:
      mapContainer.clientHeight * 0.88

  };


  animateDart(
    start,
    {
      x: target[0],
      y: target[1]
    }
  );


  /*
    다트 비행 시간
  */

  await wait(1550);


  /*
    도착
  */

  if (
    destination.type === "region"
  ) {

    mapSvg
      .select(
        `[data-region-index="${destination.featureIndex}"]`
      )
      .classed(
        "selected",
        true
      );

  }


  showImpact(
    target[0],
    target[1]
  );


  /*
    사용 처리
  */

  usedDestinations.add(
    destination.id
  );


  /*
    결과 표시
  */

  resultName.textContent =
    destination.name;


  resultDescription.textContent =
    destination.description;


  resultCard.classList.add("show");


  againButton.disabled = false;

  confirmButton.disabled = false;


  status.textContent =
    "다트가 여행지를 선택했습니다!";


  isThrowing = false;

  dartButton.disabled = false;

}


/* ------------------------------------------------------------
   11. 포물선 다트 애니메이션
   ------------------------------------------------------------ */

function animateDart(
  start,
  end
) {

  /*
    다트 초기화
  */

  dart.classList.remove("fly");

  dart.style.opacity = "1";

  dart.style.left =
    `${start.x}px`;

  dart.style.top =
    `${start.y}px`;

  dart.style.transform =
    "translate(-50%, -50%) rotate(-35deg)";


  /*
    강제 reflow

    CSS 애니메이션을 다시 실행하기 위해 필요
  */

  void dart.offsetWidth;


  const duration = 1500;

  dart.style.setProperty(
    "--flight-time",
    `${duration}ms`
  );


  /*
    requestAnimationFrame을 이용해
    포물선 이동

    y = startY
        + (endY-startY)*t
        - height*sin(pi*t)

    중간에서 가장 크게 위로 올라간다.
  */

  const startTime =
    performance.now();


  function frame(now) {

    const elapsed =
      now - startTime;

    let t =
      Math.min(
        elapsed / duration,
        1
      );


    /*
      ease-in-out
    */

    const eased =
      t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;


    /*
      포물선 높이
    */

    const arcHeight =
      150;


    const x =
      start.x +
      (end.x - start.x) * eased;


    const linearY =
      start.y +
      (end.y - start.y) * eased;


    const arc =
      Math.sin(
        Math.PI * eased
      ) * arcHeight;


    const y =
      linearY - arc;


    /*
      진행 방향에 따른 다트 회전

      시작은 비스듬하게,
      날아가는 방향을 따라 조금씩 회전.
    */

    const angle =
      -35 +
      eased * 45;


    dart.style.left =
      `${x}px`;

    dart.style.top =
      `${y}px`;

    dart.style.transform =
      `translate(-50%, -50%) rotate(${angle}deg)`;


    /*
      크기

      멀리서 날아와 가까워지는 느낌
    */

    const scale =
      0.7 + eased * 0.3;

    dart.style.fontSize =
      `${54 * scale}px`;


    if (t < 1) {

      requestAnimationFrame(frame);

    } else {

      dart.style.left =
        `${end.x}px`;

      dart.style.top =
        `${end.y}px`;

      dart.style.transform =
        `translate(-50%, -50%) rotate(10deg)`;

    }

  }


  requestAnimationFrame(frame);

}


/* ------------------------------------------------------------
   12. 충돌 효과
   ------------------------------------------------------------ */

function showImpact(x, y) {

  impact.classList.remove("show");

  impact.style.left =
    `${x}px`;

  impact.style.top =
    `${y}px`;

  void impact.offsetWidth;

  impact.classList.add("show");

}


/* ------------------------------------------------------------
   13. 다시 던지기
   ------------------------------------------------------------ */

againButton.addEventListener(
  "click",
  () => {

    resultCard.classList.remove(
      "show"
    );

    travelLinks.classList.remove(
      "show"
    );

    throwDart();

  }
);


/* ------------------------------------------------------------
   14. 여행지 결정
   ------------------------------------------------------------ */

confirmButton.addEventListener(
  "click",
  () => {

    if (!currentDestination) {
      return;
    }


    const destination =
      currentDestination.name;


    resultCard.classList.add(
      "show"
    );


    travelTitle.textContent =
      `📍 ${destination} 여행 준비`;


    /*
      검색 링크 생성

      Google 검색 / 지도 기반.

      API가 아니라 검색 URL이므로
      별도의 API KEY가 필요하지 않다.
    */

    const encoded =
      encodeURIComponent(
        destination
      );


    const tourismQuery =
      encodeURIComponent(
        `${destination} 관광지`
      );


    const foodQuery =
      encodeURIComponent(
        `${destination} 맛집`
      );


    const hotelQuery =
      encodeURIComponent(
        `${destination} 숙소`
      );


    tourismLink.href =
      `https://www.google.com/search?q=${tourismQuery}`;


    foodLink.href =
      `https://www.google.com/search?q=${foodQuery}`;


    hotelLink.href =
      `https://www.google.com/search?q=${hotelQuery}`;


    travelLinks.classList.add(
      "show"
    );


    /*
      결과 영역 아래로 이동
    */

    setTimeout(() => {

      travelLinks.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }, 100);

  }
);


/* ------------------------------------------------------------
   15. 유틸
   ------------------------------------------------------------ */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/* ------------------------------------------------------------
   16. 시작
   ------------------------------------------------------------ */

loadMaps();

</script>
