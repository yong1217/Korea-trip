<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>TRAVEL DART</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f6fb;
  --card:#fff;
  --ink:#172033;
  --muted:#737d8f;
  --line:#dfe4ec;
  --navy:#29447f;
  --map:#f7f9fc;
  --map-hover:#eef2f8;
  --map-stroke:#aab4c3;
  --selected:#ffd45c;
}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif
}
body{min-height:100vh}
button{font:inherit}
.app{width:min(100%,760px);margin:0 auto;padding:18px 14px 36px}
.header{text-align:center;padding:2px 8px 16px}
.brand{font-size:12px;font-weight:800;letter-spacing:.25em;color:var(--navy)}
h1{margin:7px 0 5px;font-size:31px;line-height:1.15;letter-spacing:-.055em}
.subtitle{margin:0;color:var(--muted);font-size:14px}

.map-card{
  position:relative;width:100%;height:min(72vh,650px);min-height:500px;
  overflow:hidden;background:var(--card);border:1px solid #d9dfe8;
  border-radius:30px;box-shadow:0 18px 50px rgba(35,50,80,.09)
}
#map{position:absolute;inset:0}
#map svg{display:block;width:100%;height:100%}
.region{
  fill:var(--map);stroke:var(--map-stroke);stroke-width:1.1;
  vector-effect:non-scaling-stroke;transition:fill .2s,stroke .2s
}
.region:hover{fill:var(--map-hover)}
.region.selected{fill:var(--selected);stroke:#c79620;stroke-width:2.2}

.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:11px;background:rgba(255,255,255,.94);z-index:20
}
.spinner{
  width:30px;height:30px;border:3px solid #dfe4ec;border-top-color:var(--navy);
  border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 다트 */
.dart{
  position:absolute;z-index:30;width:76px;height:76px;
  left:50%;top:92%;transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.22));
  transform-origin:50% 50%
}
.dart img{width:100%;height:100%;display:block}

.impact{
  position:absolute;z-index:31;pointer-events:none;width:70px;height:70px;
  opacity:0;transform:translate(-50%,-50%) scale(.3)
}
.impact.show{animation:impact .55s ease-out forwards}
.impact::before,.impact::after{
  content:"";position:absolute;left:50%;top:50%;width:100%;height:3px;
  background:#d99f22;border-radius:10px;transform:translate(-50%,-50%) rotate(45deg)
}
.impact::after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes impact{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
}

.status{
  position:absolute;z-index:35;left:50%;bottom:22px;transform:translateX(-50%);
  padding:10px 17px;border:1px solid #dfe4ec;border-radius:999px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  color:var(--muted);font-size:13px;white-space:nowrap;
  box-shadow:0 8px 24px rgba(30,45,70,.07)
}
.dart-button{
  width:100%;margin-top:16px;min-height:60px;border:0;border-radius:20px;
  color:#fff;background:var(--navy);font-size:18px;font-weight:850;
  box-shadow:0 12px 26px rgba(41,68,127,.22)
}
.dart-button:active{transform:scale(.985)}
.dart-button:disabled{opacity:.5}

.result{
  display:none;margin-top:16px;padding:22px 18px;background:#fff;
  border:1px solid var(--line);border-radius:24px;text-align:center;
  box-shadow:0 12px 35px rgba(30,42,65,.07)
}
.result.show{display:block;animation:rise .4s ease-out}
@keyframes rise{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.result-label{font-size:13px;color:var(--muted)}
.result-name{margin:5px 0 4px;font-size:32px;font-weight:900;letter-spacing:-.055em}
.result-desc{margin:0 0 18px;color:var(--muted);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{
  min-height:54px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-weight:800
}
.action.primary{background:var(--ink);color:#fff;border-color:var(--ink)}

.travel-links{
  display:none;margin-top:16px;padding:20px;background:#fff;
  border:1px solid var(--line);border-radius:24px
}
.travel-links.show{display:block;animation:rise .4s ease-out}
.travel-links h2{margin:0 0 5px;font-size:20px;letter-spacing:-.04em}
.travel-links p{margin:0 0 14px;color:var(--muted);font-size:13px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.link{
  min-height:70px;border:1px solid #e3e7ee;border-radius:15px;background:#f7f9fc;
  color:var(--ink);text-decoration:none;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:4px;font-size:13px;font-weight:800
}
.link .emoji{font-size:24px}
.footer{margin-top:20px;text-align:center;color:#9aa4b4;font-size:10px;line-height:1.5}

@media(max-width:480px){
  .app{padding:14px 12px 28px}
  h1{font-size:29px}
  .map-card{height:68vh;min-height:470px;border-radius:26px}
  .dart{width:64px;height:64px}
  .status{bottom:18px;font-size:12px}
  .links{grid-template-columns:1fr}
  .link{min-height:56px;flex-direction:row;justify-content:flex-start;padding-left:18px}
}
</style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="brand">TRAVEL DART</div>
    <h1>오늘은 어디로 떠날까요?</h1>
    <p class="subtitle">대한민국에 다트를 던져 여행지를 결정해보세요.</p>
  </header>

  <section class="map-card" id="mapCard">
    <div id="map"></div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div id="loaderText">대한민국 지도를 불러오는 중...</div>
    </div>

    <div class="dart" id="dart">
      <img src="dart.svg" alt="다트">
    </div>

    <div class="impact" id="impact"></div>
    <div class="status" id="status">지도를 준비하고 있습니다.</div>
  </section>

  <button class="dart-button" id="dartButton" disabled>🎯 다트 던지기</button>

  <section class="result" id="result">
    <div class="result-label">🎯 오늘의 여행지</div>
    <div class="result-name" id="resultName">-</div>
    <p class="result-desc" id="resultDesc">-</p>

    <div class="actions">
      <button class="action" id="againButton">🔄 다시 던지기</button>
      <button class="action primary" id="confirmButton">❤️ 여기로 결정</button>
    </div>
  </section>

  <section class="travel-links" id="travelLinks">
    <h2 id="travelTitle">📍 여행 준비하기</h2>
    <p>선택한 지역의 관광지·맛집·숙소를 바로 검색할 수 있습니다.</p>
    <div class="links">
      <a class="link" id="tourismLink" target="_blank" rel="noopener">
        <span class="emoji">🏛️</span>관광지 검색
      </a>
      <a class="link" id="foodLink" target="_blank" rel="noopener">
        <span class="emoji">🍴</span>맛집 검색
      </a>
      <a class="link" id="hotelLink" target="_blank" rel="noopener">
        <span class="emoji">🏨</span>숙소 검색
      </a>
    </div>
  </section>

  <footer class="footer">
    지도 데이터: southkorea/southkorea-maps · KOSTAT 2018 행정구역 경계
  </footer>
</div>

<script>
/* =========================================================
   TRAVEL DART v3
   - KOSTAT 2018 시군구 TopoJSON
   - 지도에는 시군구 경계 표시
   - 후보는 시/군 단위
   - 광역시/서울/세종 포함
   - 울릉군은 일반 후보에서 제외하고 울릉도·독도로 통합
   - 다트가 하단에서 포물선으로 날아감
   - 적중 지역을 화면 중앙으로 이동시키며 확대
   ========================================================= */

const MAP_URL =
  "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-topo-simple.json";

const CITY_NAMES = [
  "수원시","용인시","고양시","성남시","부천시","화성시","안산시","남양주시",
  "안양시","평택시","시흥시","파주시","의정부시","김포시","광주시","광명시",
  "하남시","군포시","오산시","이천시","안성시","구리시","의왕시","포천시",
  "양주시","여주시","동두천시","과천시",
  "춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시",
  "청주시","충주시","제천시",
  "천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시",
  "전주시","군산시","익산시","정읍시","남원시","김제시",
  "목포시","여수시","순천시","나주시","광양시",
  "포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시",
  "창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시",
  "제주시","서귀포시"
];

const METRO_CITIES = [
  "서울특별시","부산광역시","대구광역시","인천광역시",
  "광주광역시","대전광역시","울산광역시"
];

const SPECIAL = {
  id:"ulleungdo-dokdo",
  name:"울릉도·독도",
  description:"동해의 섬 여행",
  type:"special"
};

const $ = id => document.getElementById(id);

const mapCard = $("mapCard");
const map = $("map");
const loader = $("loader");
const loaderText = $("loaderText");
const status = $("status");
const dart = $("dart");
const impact = $("impact");
const dartButton = $("dartButton");
const result = $("result");
const resultName = $("resultName");
const resultDesc = $("resultDesc");
const againButton = $("againButton");
const confirmButton = $("confirmButton");
const travelLinks = $("travelLinks");
const travelTitle = $("travelTitle");
const tourismLink = $("tourismLink");
const foodLink = $("foodLink");
const hotelLink = $("hotelLink");

let svg, path, projection, mapLayer;
let features = [];
let candidates = [];
let used = new Set();
let current = null;
let throwing = false;
let dartTimer = null;

const normalize = value => String(value || "").replace(/\s/g,"");

function featureName(feature){
  return feature?.properties?.name || "";
}

function candidateId(name){
  return "candidate-" + name;
}

/* 지도 로드 */
async function loadMap(){
  try{
    loaderText.textContent = "대한민국 행정구역을 불러오는 중...";

    const topo = await d3.json(MAP_URL);
    const objectName = Object.keys(topo.objects)[0];
    const collection = topojson.feature(topo, topo.objects[objectName]);

    features = collection.features;

    drawMap(collection);
    buildCandidates();

    loader.style.display = "none";
    dartButton.disabled = false;
    status.textContent = `${candidates.length}개의 여행지를 준비했습니다.`;
  }catch(error){
    console.error(error);
    loaderText.textContent = "지도 데이터를 불러오지 못했습니다.";
    status.textContent = "인터넷 연결을 확인한 후 새로고침해주세요.";
  }
}

/* 지도 그리기 */
function drawMap(collection){
  const width = map.clientWidth;
  const height = map.clientHeight;

  svg = d3.select(map)
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio","xMidYMid meet");

  /*
    KOSTAT TopoJSON은 TopoJSON 좌표를 사용하므로 geoIdentity 사용.
    기본 지도 크기를 기존보다 조금 키운다.
  */
  projection = d3.geoIdentity()
    .reflectY(true)
    .fitExtent(
      [[8, 8], [width - 8, height - 55]],
      collection
    );

  const baseScale = projection.scale();
  const baseTranslate = projection.translate();
  const centerX = width / 2;
  const centerY = height * .47;
  const baseZoom = 1.38;

  // 기본 지도 위치를 화면 중앙보다 살짝 오른쪽으로 이동
  // 모바일에서 대한민국 지도가 왼쪽으로 치우쳐 보이는 현상을 보정한다.
  const mapShiftX = width * 0.105;

  projection
    .scale(baseScale * baseZoom)
    .translate([
      centerX + (baseTranslate[0] - centerX) * baseZoom + mapShiftX,
      centerY + (baseTranslate[1] - centerY) * baseZoom
    ]);

  path = d3.geoPath(projection);

  mapLayer = svg.append("g")
    .attr("class","map-layer");

  mapLayer.append("g")
    .attr("class","regions")
    .selectAll("path")
    .data(features)
    .join("path")
    .attr("class","region")
    .attr("d", path)
    .on("mouseenter", function(_, d){
      if(!throwing && !current){
        const name = featureName(d);
        if(name) status.textContent = name;
      }
    })
    .on("mouseleave", function(){
      if(!throwing && !current){
        status.textContent = `${candidates.length}개의 여행지를 준비했습니다.`;
      }
    });
}

/* 후보 만들기 */
function buildCandidates(){
  const list = [];

  /* 1) 일반 시 */
  CITY_NAMES.forEach(city=>{
    const cityNorm = normalize(city);

    const indexes = features
      .map((f,i)=>({f,i,n:normalize(featureName(f))}))
      .filter(({n}) =>
        n === cityNorm ||
        (n.startsWith(cityNorm) && n.endsWith("구"))
      )
      .map(({i})=>i);

    if(indexes.length){
      list.push({
        id:candidateId(city),
        name:city,
        description:`${city} 여행`,
        type:"city",
        featureIndexes:indexes
      });
    }
  });

  /* 2) 광역시 + 서울 */
  METRO_CITIES.forEach(city=>{
    const cityNorm = normalize(city);

    const indexes = features
      .map((f,i)=>({f,i,n:normalize(featureName(f))}))
      .filter(({n}) =>
        n === cityNorm ||
        (n.startsWith(cityNorm) && n.endsWith("구"))
      )
      .map(({i})=>i);

    if(indexes.length){
      list.push({
        id:candidateId(city),
        name:city,
        description:`${city} 여행`,
        type:"metro",
        featureIndexes:indexes
      });
    }
  });

  /* 3) 세종 */
  const sejong = features
    .map((f,i)=>({f,i,n:normalize(featureName(f))}))
    .filter(({n})=>n === "세종특별자치시" || n === "세종시")
    .map(({i})=>i);

  if(sejong.length){
    list.push({
      id:candidateId("세종특별자치시"),
      name:"세종특별자치시",
      description:"세종 여행",
      type:"city",
      featureIndexes:sejong
    });
  }

  /* 4) 군 - 울릉군은 별도 후보 */
  features.forEach((feature,index)=>{
    const name = normalize(featureName(feature));

    if(name.endsWith("군") && name !== "울릉군"){
      const display = featureName(feature);

      if(!list.some(x=>normalize(x.name) === name)){
        list.push({
          id:candidateId(display),
          name:display,
          description:`${display} 여행`,
          type:"county",
          featureIndexes:[index]
        });
      }
    }
  });

  /* 5) 울릉도·독도 */
  const ulleungIndexes = features
    .map((f,i)=>({n:normalize(featureName(f)),i}))
    .filter(x=>x.n === "울릉군")
    .map(x=>x.i);

  list.push({
    ...SPECIAL,
    featureIndexes:ulleungIndexes
  });

  candidates = list;

  console.log("TRAVEL DART 후보 수:", candidates.length);
}

/* 랜덤 */
function getRandomCandidate(){
  let available = candidates.filter(x=>!used.has(x.id));

  if(!available.length){
    used.clear();
    available = candidates.slice();
    status.textContent = "모든 여행지를 한 번씩 뽑았습니다. 다시 시작합니다.";
  }

  return available[Math.floor(Math.random()*available.length)];
}

/* 목표 좌표 */
function getTarget(candidate){
  const selectedFeatures = candidate.featureIndexes
    .map(i=>features[i])
    .filter(Boolean);

  if(!selectedFeatures.length){
    return [
      mapCard.clientWidth / 2,
      mapCard.clientHeight * .45
    ];
  }

  const fc = {
    type:"FeatureCollection",
    features:selectedFeatures
  };

  /*
    중요:
    울릉도·독도도 경위도 좌표를 직접 넣지 않고
    실제 지도 feature의 중심점을 사용한다.
    기존 코드의 projection([130.90,37.50]) 방식은
    geoIdentity와 맞지 않아 잘못된 위치를 만들 수 있었다.
  */
  const centroid = path.centroid(fc);

  if(!Number.isFinite(centroid[0]) || !Number.isFinite(centroid[1])){
    return [
      mapCard.clientWidth / 2,
      mapCard.clientHeight * .45
    ];
  }

  return clampPoint(centroid);
}

function clampPoint(point){
  const w = mapCard.clientWidth;
  const h = mapCard.clientHeight;

  return [
    Math.max(30, Math.min(w-30, point[0])),
    Math.max(30, Math.min(h-90, point[1]))
  ];
}

/* 지도 원상복귀 */
function resetMapZoom(duration=350){
  if(!mapLayer) return;

  mapLayer.interrupt()
    .transition()
    .duration(duration)
    .ease(d3.easeCubicInOut)
    .attr("transform", null);
}

/*
  적중 지역을 화면 중앙으로 가져오면서 확대.

  기존 코드의 문제:
  - point를 계산해놓고 실제 transform에는 사용하지 않음
  - 따라서 지역이 중앙으로 오지 않고 지도 전체가 화면 밖으로 밀릴 수 있음

  수정:
  확대된 point의 좌표가 cx, cy에 오도록
  translate 값을 계산한다.
*/
function zoomMapTo(point, scale=1.72){
  if(!mapLayer) return null;

  const width = mapCard.clientWidth;
  const height = mapCard.clientHeight;

  /* 확대 후 적중 지역이 화면의 정중앙보다 약간 위에 오도록 한다. */
  const cx = width / 2;
  const cy = height * .42;

  /*
     현재 지도에서 target이 point에 있다.
     scale 배율로 확대했을 때 target을 cx, cy로 보내려면
     아래처럼 translate 해야 한다.
  */
  const tx = cx - point[0] * scale;
  const ty = cy - point[1] * scale;

  mapLayer.interrupt()
    .transition()
    .duration(950)
    .ease(d3.easeCubicInOut)
    .attr(
      "transform",
      `translate(${tx},${ty}) scale(${scale})`
    );

  /* 확대 상태에서는 다트를 계속 숨긴다. */
  return [cx, cy];
}

/* 다트 던지기 */
dartButton.addEventListener("click", throwDart);

async function throwDart(){
  if(throwing || !projection) return;

  throwing = true;
  current = getRandomCandidate();

  result.classList.remove("show");
  travelLinks.classList.remove("show");
  dartButton.disabled = true;

  /* 이전 결과에서 확대된 지도를 원래 크기로 */
  resetMapZoom(250);

  /* 선택 표시 제거 */
  svg.selectAll(".region").classed("selected",false);

  /*
    다트는 지도 중앙 하단에서 출발.
    휴대폰 화면에서도 아래쪽에서 날아오는 느낌이 나도록 한다.
  */
  const start = [
    mapCard.clientWidth / 2,
    mapCard.clientHeight * .93
  ];

  const target = getTarget(current);

  /* 이전 충격 효과 제거 */
  impact.classList.remove("show");
  dart.style.opacity = "0";

  status.textContent = "🎯 다트가 날아갑니다...";

  await flyDart(start,target,1450);

  /* 지역 강조 */
  svg.selectAll(".region").classed(
    "selected",
    (d,i)=>current.featureIndexes.includes(i)
  );

  /* 충격 표시 */
  showImpact(target);

  /* 확대가 시작되면 다트는 숨긴다.
     확대된 지도 위에 다트가 중앙으로 따라가는 현상을 방지한다. */
  dart.style.opacity = "0";

  /*
    다트가 꽂힌 직후 지역 확대.
    확대 대상이 화면 중앙에 오므로
    어느 지역을 뽑아도 지도 밖으로 사라지지 않는다.
  */
  const zoomedTarget = zoomMapTo(target,1.72);

  if(zoomedTarget){
    /* 다트는 확대 화면에 절대 다시 나타나지 않게 한다. */
    dart.style.opacity = "0";

    /* 충격 효과만 확대된 적중 위치를 따라간다. */
    impact.style.left = `${zoomedTarget[0]}px`;
    impact.style.top = `${zoomedTarget[1]}px`;
  }

  used.add(current.id);

  resultName.textContent = current.name;
  resultDesc.textContent = current.description;
  result.classList.add("show");

  status.textContent = "다트가 여행지를 선택했습니다!";

  throwing = false;
  dartButton.disabled = false;
}

/* 포물선 비행 */
function flyDart(start,end,duration){
  return new Promise(resolve=>{
    if(dartTimer) cancelAnimationFrame(dartTimer);

    dart.style.opacity = "1";

    const startTime = performance.now();

    function frame(now){
      const raw = Math.min(1,(now-startTime)/duration);

      /* 부드러운 가감속 */
      const t = raw < .5
        ? 2*raw*raw
        : 1-Math.pow(-2*raw+2,2)/2;

      const x = start[0] + (end[0]-start[0])*t;
      const linearY = start[1] + (end[1]-start[1])*t;

      /*
        중앙에서 위로 크게 솟는 포물선.
        다트가 아래에서 위쪽 지역으로 날아가는 느낌.
      */
      const arc = Math.sin(Math.PI*t) * Math.min(190, mapCard.clientHeight * .25);
      const y = linearY - arc;

      /*
        진행 방향에 맞춰 다트를 살짝 회전.
      */
      const dx = end[0] - start[0];
      const dy = end[1] - start[1];
      const direction = Math.atan2(dy,dx) * 180 / Math.PI;
      const angle = direction + 90;

      dart.style.left = `${x}px`;
      dart.style.top = `${y}px`;
      dart.style.transform =
        `translate(-50%,-50%) rotate(${angle}deg)`;

      if(raw < 1){
        dartTimer = requestAnimationFrame(frame);
      }else{
        dart.style.left = `${end[0]}px`;
        dart.style.top = `${end[1]}px`;
        dart.style.transform =
          `translate(-50%,-50%) rotate(${angle}deg)`;

        resolve();
      }
    }

    dartTimer = requestAnimationFrame(frame);
  });
}

function showImpact(point){
  impact.classList.remove("show");
  impact.style.left = `${point[0]}px`;
  impact.style.top = `${point[1]}px`;
  void impact.offsetWidth;
  impact.classList.add("show");
}

/* 다시 던지기 */
againButton.addEventListener("click",()=>{
  if(throwing) return;

  result.classList.remove("show");
  travelLinks.classList.remove("show");

  /* 확대된 상태를 먼저 원상복귀 */
  resetMapZoom(250);

  throwDart();
});

/* 여기로 결정 */
confirmButton.addEventListener("click",()=>{
  if(!current) return;

  const name = current.name;

  tourismLink.href =
    `https://www.google.com/search?q=${encodeURIComponent(name+" 관광지")}`;

  foodLink.href =
    `https://www.google.com/search?q=${encodeURIComponent(name+" 맛집")}`;

  hotelLink.href =
    `https://www.google.com/search?q=${encodeURIComponent(name+" 숙소")}`;

  travelTitle.textContent = `📍 ${name} 여행 준비`;
  travelLinks.classList.add("show");

  setTimeout(()=>{
    travelLinks.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  },80);
});

/* 화면 크기 변경 시 지도를 다시 그리지 않고 현재 상태 유지 */
window.addEventListener("resize",()=>{
  /*
    모바일 브라우저 주소창이 열리고 닫힐 때
    resize가 발생하므로 강제 재로드는 하지 않는다.
    새로고침하면 정상적인 크기로 다시 계산된다.
  */
});
